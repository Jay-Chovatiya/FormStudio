<div class="preview-page-wrapper">
  <header class="preview-navbar">
    <button type="button" class="fs-btn fs-btn-secondary fs-btn-sm" (click)="goBack()" title="Back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      Back
    </button>
    <span class="preview-badge">Form Preview Mode</span>
  </header>

  <main class="preview-content">
    <app-dynamic-form [formDefinition]="form()" [isPreview]="true" />
  </main>
</div>
