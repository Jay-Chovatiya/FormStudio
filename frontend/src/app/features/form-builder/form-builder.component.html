<div class="builder-container">
  <header class="builder-header">
    <div class="header-brand">
      <button type="button" class="fs-btn fs-btn-secondary fs-btn-sm" (click)="backToList()" title="Back to Form Library">
        ← Forms List
      </button>
      <div class="brand-logo" title="FormStudio Builder">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <line x1="10" y1="9" x2="8" y2="9"/>
        </svg>
      </div>
      <span class="brand-title">FormStudio</span>
      @if (form(); as currentForm) {
        <span class="form-title-badge" title="Click to view form properties">
          {{ currentForm.name }}
        </span>
        <span class="fs-badge" [class.fs-badge-success]="currentForm.status === 'Published'" [class.fs-badge-secondary]="currentForm.status !== 'Published'">
          {{ currentForm.status }}
        </span>
      }
    </div>

    <div class="header-actions">
      <button type="button" class="fs-btn fs-btn-secondary fs-btn-sm" (click)="undo()" [disabled]="!canUndo()" title="Undo (Ctrl+Z)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7v6h6"/>
          <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
        </svg>
        Undo
      </button>

      <button type="button" class="fs-btn fs-btn-secondary fs-btn-sm" (click)="redo()" [disabled]="!canRedo()" title="Redo (Ctrl+Y)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 7v6h-6"/>
          <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/>
        </svg>
        Redo
      </button>

      <button type="button" class="fs-btn fs-btn-secondary fs-btn-sm" (click)="openPreview()" title="Preview Live Form">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        Preview
      </button>

      <button
        type="button"
        class="fs-btn fs-btn-primary fs-btn-sm"
        (click)="saveForm()"
        [disabled]="saving()"
        [title]="isEditMode() ? 'Update Form in Database' : 'Create Form in Database'"
      >
        💾 {{ saving() ? (isEditMode() ? 'Updating...' : 'Creating...') : (isEditMode() ? 'Update Form' : 'Create Form') }}
      </button>
    </div>
  </header>

  <div class="builder-workspace" cdkDropListGroup>
    <app-field-palette class="workspace-palette"></app-field-palette>
    <app-form-canvas class="workspace-canvas"></app-form-canvas>
    <app-properties-panel class="workspace-properties"></app-properties-panel>
  </div>
</div>
