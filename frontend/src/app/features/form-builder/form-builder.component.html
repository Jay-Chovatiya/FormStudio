<div class="builder-container">
  <header class="builder-header">
    <div class="header-brand">
      <button type="button" class="fs-btn fs-btn-secondary fs-btn-sm btn-header-action btn-back-list" (click)="backToList()" title="Back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        <span class="btn-text">Back</span>
      </button>
      <div class="brand-logo" title="FormStudio Builder">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <line x1="10" y1="9" x2="8" y2="9"/>
        </svg>
      </div>
      <span class="brand-title">FormStudio</span>
      @if (form(); as currentForm) {
        <span class="form-title-badge" title="Click to view form properties">
          {{ currentForm.name }}
        </span>
        <span class="fs-badge" [class.fs-badge-success]="currentForm.status === 'Published'" [class.fs-badge-secondary]="currentForm.status !== 'Published'">
          {{ currentForm.status }}
        </span>
      }
    </div>

    <div class="header-actions">
      <button type="button" class="fs-btn fs-btn-secondary fs-btn-sm btn-header-action" (click)="undo()" [disabled]="!canUndo()" title="Undo (Ctrl+Z)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7v6h6"/>
          <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
        </svg>
        <span class="btn-text">Undo</span>
      </button>

      <button type="button" class="fs-btn fs-btn-secondary fs-btn-sm btn-header-action" (click)="redo()" [disabled]="!canRedo()" title="Redo (Ctrl+Y)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 7v6h-6"/>
          <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/>
        </svg>
        <span class="btn-text">Redo</span>
      </button>

      <button type="button" class="fs-btn fs-btn-secondary fs-btn-sm btn-header-action" (click)="openPreview()" title="Preview Live Form">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span class="btn-text">Preview</span>
      </button>

      @if (form()?.id) {
        <button type="button" class="fs-btn fs-btn-secondary fs-btn-sm btn-header-action" (click)="openResponses()" title="View Submissions & Responses">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
          <span class="btn-text">Responses</span>
        </button>
      }

      <button
        type="button"
        class="fs-btn fs-btn-primary fs-btn-sm btn-header-action btn-save"
        (click)="saveForm()"
        [disabled]="saving()"
        [title]="isEditMode() ? 'Update Form in Database' : 'Create Form in Database'"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        <span class="btn-text">
          {{ saving() ? (isEditMode() ? 'Updating...' : 'Creating...') : (isEditMode() ? 'Update Form' : 'Create Form') }}
        </span>
      </button>
    </div>
  </header>

  <div class="mobile-builder-nav" role="tablist" aria-label="Builder View Switcher">
    <button
      type="button"
      class="mobile-nav-btn"
      [class.active]="mobileView() === 'palette'"
      (click)="setMobileView('palette')"
      role="tab"
      [attr.aria-selected]="mobileView() === 'palette'"
    >
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      <span>Fields</span>
    </button>

    <button
      type="button"
      class="mobile-nav-btn"
      [class.active]="mobileView() === 'canvas'"
      (click)="setMobileView('canvas')"
      role="tab"
      [attr.aria-selected]="mobileView() === 'canvas'"
    >
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      <span>Canvas</span>
    </button>

    <button
      type="button"
      class="mobile-nav-btn"
      [class.active]="mobileView() === 'properties'"
      (click)="setMobileView('properties')"
      role="tab"
      [attr.aria-selected]="mobileView() === 'properties'"
    >
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>Properties</span>
    </button>
  </div>

  <div class="builder-workspace" cdkDropListGroup>
    <app-field-palette
      class="workspace-palette"
      [class.mobile-active]="mobileView() === 'palette'"
    ></app-field-palette>
    <app-form-canvas
      class="workspace-canvas"
      [class.mobile-active]="mobileView() === 'canvas'"
    ></app-form-canvas>
    <app-properties-panel
      class="workspace-properties"
      [class.mobile-active]="mobileView() === 'properties'"
    ></app-properties-panel>
  </div>
</div>
